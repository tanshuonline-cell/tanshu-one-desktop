name: Desktop frontend build
on:
  push:
    branches: [main, feature/premium-home-dashboard]
  pull_request:
    branches: [main, feature/photo-studio-dark-workspace-clean]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript and Vite production build
        run: npm run build
