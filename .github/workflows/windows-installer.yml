name: Windows desktop installer
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Create Windows application icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/icons | Out-Null
          $icon = ""
          [IO.File]::WriteAllBytes("src-tauri/icons/icon.ico", [Convert]::FromBase64String($icon))
      - name: Install frontend dependencies
        run: npm install
      - name: Build TANSHU ONE Windows installers
        run: npm run tauri build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: TANSHU-ONE-Windows-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
